[package]
name = "ssk-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
ssk-sim.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "signal", "macros", "fs", "io-util", "net"] }
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring"] }
serde_yaml = "0.9"
base64 = "0.22"
libp2p = { version = "0.57.1", default-features = false, features = ["tokio", "quic", "kad", "identify", "macros", "ed25519"] }
futures = "0.3"
postcard = { version = "1", features = ["alloc"] }
iroh-relay = { version = "1.3.0", default-features = false, features = ["server", "tls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
blake3 = "1"
ed25519-dalek = "3"
