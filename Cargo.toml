[workspace]
members = ["crates/ssk-sim", "crates/ssk-net", "crates/ssk-client", "crates/ssk"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["xakepp35@gmail.com"]

[workspace.dependencies]
ssk-sim = { path = "crates/ssk-sim" }
ssk-net = { path = "crates/ssk-net" }
ssk-client = { path = "crates/ssk-client" }
macroquad = { version = "0.4.16", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "registry", "std"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
