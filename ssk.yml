# Linux: start ./target/release/ssk (host + playable ship).
# The Windows package sets mode: join and connects to the Linux address below.
# Other modes: offline (survival), join (LAN client).
mode: host
connect: 192.168.50.155:4202
window:
  width: 1600
  height: 1000
  fullscreen: false
  # software = isolated CPU Vulkan on Linux; hardware = native GPU Vulkan.
  # Linux incident package uses software; Windows packaging selects hardware.
  # --gpu-pci 0000:65:00.0 or --gpu-uuid HEX pins a physical GPU, not a name.
  # --graphics hardware or --gpu-index N also explicitly selects the GPU path.
  adapter: software
  adapter_index: null
  adapter_uuid: null
  adapter_pci: null
  present_mode: fifo
  # Only explicit Mailbox uses this idle repaint cadence. FIFO follows VSync.
  mailbox_repaint_hz: 60
audio:
  # Set false (or pass --no-audio) to skip opening the audio device entirely.
  enabled: true
network:
  world: ssk-playground-v1
  seed: 42
  # Each computer creates its own key. Never copy runtime/ between players.
  identity_file: runtime/identity.key
  contact_cache: null
  udp_bind: 0.0.0.0:4200
  discovery_bind: 0.0.0.0:4201
  # Host/server enables TCP 4202 automatically. Game traffic stays UDP/QUIC.
  bootstrap_bind: null
  advertise: null
  relays: []
  seeds: []
  friends: []
